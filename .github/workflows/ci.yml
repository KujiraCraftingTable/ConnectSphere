name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-lint:
    name: Design-system guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint-design.sh

  backend:
    name: Backend unit tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    name: iOS build + unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run ConnectSphereTests
        run: |
          xcodebuild test \
            -project ConnectSphere.xcodeproj \
            -scheme ConnectSphere \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:ConnectSphereTests \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

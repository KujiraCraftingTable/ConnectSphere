services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: connectsphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: connectsphere
      POSTGRES_USER: connectsphere_user
      POSTGRES_PASSWORD: connectsphere_pass
    ports:
      - "5432:5432"
    # Any statement over half a second goes to the container log
    # (`docker logs connectsphere_db`). The slow-query half of tracing.
    command: ["postgres", "-c", "log_min_duration_statement=500"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectsphere_user -d connectsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connectsphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Swift/Vapor backend (was Node/Express until the Phase 6 cutover. The
  # retired Node app is in git history, tag `node-backend-final`).
  # Container name / published port are unchanged so nothing downstream (the iOS
  # app's APIBaseURL, dev.sh, TablePlus) needs touching.
  backend:
    build:
      context: ../server
    container_name: connectsphere_backend
    restart: unless-stopped
    init: true                      # SIGTERM → Vapor graceful shutdown (queue workers, DB pool)
    command: ["serve", "--env", "development", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - .env                        # JWT_SECRET, DB creds, SMTP, etc. (gitignored; teammates copy .env.example)
    environment:                    # applied after env_file, so these win, host-vs-container differences
      NODE_ENV: development         # Vapor maps this via `--env`; kept for parity with the seed data
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama runs on the host, not in a container
      RUN_MIGRATIONS: "1"           # replay ./migrations/*.sql at boot (advisory-locked, idempotent)
      MIGRATIONS_DIR: /migrations
      RUN_JOBS: "1"                 # this server now owns the schedule + queue workers
    extra_hosts:
      - "host.docker.internal:host-gateway"           # harmless on macOS, required on Linux
    volumes:
      - ./migrations:/migrations:ro                   # the 27 shared SQL files the migration runner replays
      - ./uploads:/app/uploads                        # user uploads (served at /uploads, /uploads/messages behind a JWT gate)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s            # release Swift build + first-boot migrations

volumes:
  postgres_data:
  redis_data:
